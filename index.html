<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F6F1E1">
<title>Shajare Ahmed Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one full-bleed map canvas; search and controls float on it; details rise as a sheet (phone) or sit in a side panel (desktop). */
  --ivory:#F6F1E1;
  --paper:#FFFDF6;
  --gold:#B8901F;
  --gold-hi:#E6CB72;
  --gold-deep:#7A5C10;
  --ink:#3A2E14;
  --muted:#7C6F52;
  --line:#DCCB95;
  --ok:#2F6B4F;
  --warn:#9A5B13;
  --bad:#9B2C2C;
  --display:"Cinzel","Trajan Pro","Cormorant SC","Noto Naskh Arabic",Georgia,serif;
  --body:"Nunito Sans","Noto Naskh Arabic","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
[hidden]{display:none!important}

/* Sign-in */
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 25%,#FFFDF4 0,var(--ivory) 70%);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.card{width:min(400px,100%);text-align:center}
.card img{width:132px;height:132px;border-radius:50%;object-fit:cover;mix-blend-mode:multiply}
.card h1{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:.05em;color:var(--gold-deep);margin:6px 0 2px;text-wrap:balance}
.card .tagline{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 22px}
.card form{display:flex;flex-direction:column;gap:10px;text-align:start}
.card label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.msg{min-height:20px;font-size:13.5px;color:var(--bad);margin:4px 0 0;text-align:center}
.msg{font-weight:700}
.msg.info{color:var(--muted);font-weight:400}
.ver{font-size:11px;color:var(--muted);margin:18px 0 0;letter-spacing:.08em}

/* Header */
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar img{width:36px;height:36px;border-radius:50%;object-fit:cover;mix-blend-mode:multiply}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--gold-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative}
.cbtn{margin-inline-start:auto;flex:none;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;min-height:36px}
.cbtn.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold-deep);color:#fff}
.out{flex:none;border:1px solid var(--line);background:none;border-radius:50%;width:36px;height:36px;font-size:18px;font-weight:700;color:var(--muted);line-height:1}
.menu{position:absolute;inset-inline-end:10px;top:calc(100% + 4px);z-index:30;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 22px rgba(122,92,16,.2);display:flex;flex-direction:column;min-width:220px;overflow:hidden}
.menu button{text-align:start;padding:12px 16px;border:0;border-bottom:1px solid var(--ivory);background:none;min-height:46px;font-weight:600}
.node.sp{background:#FBF5E2}
.row{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--ivory)}
.row b{display:block;overflow-wrap:anywhere}
.row small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.row .acts{margin-top:8px;gap:6px}
.row .btn{min-height:38px;padding:0 12px;font-size:13px}
@media (max-width:480px){.brand small{display:none}.brand b{font-size:15px;letter-spacing:.04em;white-space:normal;line-height:1.1}.cbtn{padding:7px 11px}}
#admin{position:absolute;inset:0;z-index:12;background:var(--ivory);overflow-y:auto;-webkit-overflow-scrolling:touch}
.adm{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.admhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.admhead h2{font-size:22px}
#admmsg{text-align:start;margin:6px 0 0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;margin-top:14px}
.panel h3{margin-top:0}
.panel .help{margin:0 0 10px}
.linkbox{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.linkbox .field{flex:1 1 220px;height:42px;font-size:13px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.linkbox .btn,.panel>.acts .btn{min-height:42px}

main{flex:1;min-height:0;display:flex;position:relative}

/* Canvas */
#stage{flex:1;min-width:0;position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(circle at 50% 30%, #FFFDF4 0, rgba(255,253,244,0) 60%),
    radial-gradient(var(--line) 1px, transparent 1.2px) 0 0/26px 26px,
    var(--ivory)}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;opacity:.75}
#edges #epath2{stroke:var(--gold-deep);stroke-dasharray:5 5}
.node.inlaw{background:#FFF8E6;border-color:var(--gold)}

.node{position:absolute;left:0;top:0;width:176px;height:60px;display:flex;align-items:center;gap:9px;padding:0 12px 0 7px;background:var(--paper);border:1.5px solid var(--line);border-radius:30px;box-shadow:0 2px 6px rgba(122,92,16,.10);cursor:pointer}
.node.unv{border-style:dashed;border-color:var(--gold)}
.node.me{border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,203,114,.55),0 2px 8px rgba(122,92,16,.18)}
.node.sel{border-color:var(--gold-deep);border-style:solid;box-shadow:0 0 0 4px rgba(184,144,31,.35),0 6px 16px rgba(122,92,16,.25)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0)}
.av b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ivory);font-family:var(--display);font-weight:700;font-size:13px;color:var(--gold-deep);letter-spacing:.03em}
.tx{min-width:0;display:flex;flex-direction:column}
.nm{font-weight:700;font-size:13.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nk{font-size:11.5px;line-height:1.2;font-weight:600;font-style:italic;color:var(--gold-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx.hasnk .nm{-webkit-line-clamp:1}
#stage[data-z="far"] .nk{display:none}
.sb{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.gem{position:absolute;right:9px;top:-6px;width:11px;height:11px;transform:rotate(45deg);background:linear-gradient(135deg,#fff,var(--gold-hi) 55%,var(--gold));border:1px solid var(--gold-deep);border-radius:2px}
.you{position:absolute;left:14px;top:-9px;background:var(--gold-deep);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:999px}
.tog{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);min-width:26px;height:24px;padding:0 7px;border-radius:999px;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);font-size:11.5px;font-weight:700;line-height:1;display:flex;align-items:center;gap:3px;z-index:2}
.tog.open{background:var(--gold);color:#fff}
.tog::before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor}
.tog.open::before{transform:rotate(180deg)}
.tog.side{min-width:30px;padding:0 6px}
.tog.side::before{display:none}
.tog.up{bottom:auto;top:-24px}
.tog.up::before{transform:rotate(180deg)}
.tog.up.open::before{transform:none}
.tog.side svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.blabel{display:none;position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--gold-deep);font-size:calc(13px*var(--inv,1));text-shadow:0 0 6px var(--ivory),0 0 6px var(--ivory)}
#stage[data-z="far"] .blabel.on{display:block}
#stage[data-z="far"] .sb,#stage[data-z="mid"] .sb{display:none}
#stage[data-z="far"] .tog,#stage[data-z="far"] .gem,#stage[data-z="far"] .you{display:none}
/* Floating search and controls */
.search{position:absolute;left:12px;top:12px;width:min(340px,calc(100% - 80px));z-index:5}
.search input{width:100%;height:44px;border-radius:22px;border:1.5px solid var(--gold);background:var(--paper);padding:0 16px;box-shadow:0 3px 10px rgba(122,92,16,.15)}
.search input::placeholder{color:var(--muted)}
.results{margin-top:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 22px rgba(122,92,16,.2);overflow:hidden;display:none;max-height:260px;overflow-y:auto}
.results.on{display:block}
.results button{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--ivory);padding:9px 14px;min-height:44px}
.results button small{display:block;color:var(--muted);font-size:11.5px}
.results p{margin:0;padding:12px 14px;color:var(--muted)}
.ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
.ctl button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);font-size:21px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 3px 10px rgba(122,92,16,.15)}
.ctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.note{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--muted);background:rgba(255,253,246,.85);border-radius:999px;padding:3px 10px;z-index:1;pointer-events:none}
.toast{position:absolute;left:50%;top:68px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13.5px;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.toast.err{background:var(--bad)}

/* Sheet (phone) / side panel (desktop) */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:66%;background:var(--paper);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(122,92,16,.22);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:8;display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheet.busy{pointer-events:none;opacity:.7}
#sheet::before{content:"";flex:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--ivory);font-size:18px;line-height:1;color:var(--muted);z-index:1}
#body{flex:1;min-height:0;overflow-y:auto;padding:10px 18px 22px;-webkit-overflow-scrolling:touch}
.head{display:flex;gap:14px;align-items:center;padding-right:40px}
.head .av{width:64px;height:64px}.head .av b{width:54px;height:54px;font-size:18px}
h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;margin:0;color:var(--gold-deep);text-wrap:balance;overflow-wrap:anywhere}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;border:1px solid var(--line);background:var(--ivory)}
.pill.ok{color:var(--ok);border-color:currentColor;background:none}
.pill.wn{color:var(--warn);border-color:currentColor;border-style:dashed;background:none}
.pill.rel{color:var(--gold-deep);border-color:var(--gold)}
.comp{margin:12px 0;font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-hi),var(--gold))}
h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--ivory);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;min-height:36px}
.chip.add{border-style:dashed;border-color:var(--gold);background:none;color:var(--gold-deep)}
.chip.on{background:var(--gold);border-color:var(--gold-deep);color:#fff}
.none{color:var(--muted);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);font-weight:700;font-size:14px}
.btn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold-deep);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.btn.txt{border-color:transparent;background:none;color:var(--muted)}
.btn.wide{width:100%}
.step{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 40px 6px 0}
.q{font-family:var(--display);font-weight:700;font-size:18px;color:var(--gold-deep);margin:0 0 12px;letter-spacing:.03em;text-wrap:balance}
.field{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--gold);background:#fff;padding:0 14px;font-size:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:-6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--ivory);font-weight:700}
.seg button.on{border-color:var(--gold-deep);background:var(--gold);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.match{border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;background:var(--ivory);margin-bottom:4px}
.match dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:13px}
.match dt{color:var(--muted)}.match dd{margin:0;font-weight:600}
.help{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.empty{display:none}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:-4px;background:var(--paper)}
.sugg:empty{display:none}
.sugg button{text-align:start;border:0;border-bottom:1px solid var(--ivory);background:none;padding:9px 12px;min-height:44px;font-weight:600}
.sugg button small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.sugg button.none{color:var(--muted);font-weight:400}
.sect{border-top:1px solid var(--line);margin-top:16px;padding-top:4px}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 44%}
textarea.field{height:auto;min-height:84px;padding:10px 14px;resize:vertical}
.picked{display:flex;align-items:center;gap:8px;border:1.5px solid var(--gold);border-radius:12px;padding:8px 12px;background:var(--ivory)}
.picked span{flex:1;min-width:0;font-weight:600}.picked small{display:block;font-weight:400;color:var(--muted)}
.drow{display:grid;grid-template-columns:80px 1fr 88px;gap:8px}
.drow .field{padding:0 8px;min-width:0}
.pick{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pick.show{position:static;opacity:1;width:100%;height:50px;pointer-events:auto;margin-top:8px;border-radius:12px;border:1.5px solid var(--gold);padding:0 12px;background:#fff}
.dates{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px}
.dates dt{color:var(--muted)}
.dates dd{margin:0;font-weight:600}
.dates small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}

@media (min-width:900px){
  #sheet{position:static;transform:none;transition:none;width:390px;max-height:none;flex:none;border-top:0;border-inline-start:1px solid var(--line);border-radius:0;box-shadow:none}
  #sheet::before{display:none}
  .x{display:none}
  #body{padding:22px 24px}
  .head{padding-right:0}
  .empty{display:block}
  .brand b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){#sheet,.toast{transition:none}}
/* Family Calendar */
#cal{position:absolute;inset:0;z-index:12;background:var(--ivory);overflow-y:auto;-webkit-overflow-scrolling:touch}
.calwrap{max-width:1040px;margin:0 auto;padding:16px 16px 48px}
#calmsg{text-align:start;margin:6px 0 0}
.calbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.calbar .seg{flex:none}
.calbar .seg button{flex:none;min-height:40px;padding:0 16px}
.calbar .chip.on{background:var(--gold);border-color:var(--gold-deep);color:#fff}
.calbar select.field{width:auto;height:40px;font-size:14px;padding:0 10px;border-radius:999px}
.calcols{display:grid;gap:0 14px;grid-template-columns:minmax(0,1fr)}
.calnav{display:flex;align-items:center;gap:6px;margin:0 0 10px}
.calnav b{flex:1;min-width:0;text-align:center;font-family:var(--display);color:var(--gold-deep);font-size:17px;letter-spacing:.04em}
.calnav b small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.calnav button{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);font-size:18px;font-weight:700;line-height:1}
.calnav button.now{width:auto;border-radius:999px;padding:0 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.grid .wd{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700;padding:2px 0}
.day{min-height:60px;border:1px solid var(--line);border-radius:10px;background:var(--ivory);padding:4px 5px;text-align:start;display:flex;flex-direction:column;gap:1px;min-width:0;overflow:hidden}
.day b{font-size:14px;font-variant-numeric:tabular-nums;line-height:1.2}
.day small{font-size:10px;color:var(--muted);line-height:1.1;white-space:nowrap}
.day .mk{margin-top:auto;font-size:12px;line-height:1.3;white-space:nowrap;font-weight:700;color:var(--gold-deep)}
.day.has{background:#fff;border-color:var(--gold)}
.day.now{box-shadow:inset 0 0 0 2px var(--gold)}
.day.pick{background:var(--gold);border-color:var(--gold-deep);color:#fff}
.day.pick small,.day.pick .mk{color:#fff}
.day.blank{border:0;background:none;min-height:0}
.evrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--ivory);min-height:52px}
.evrow .when{flex:none;width:68px;font-weight:700;font-size:13px;color:var(--gold-deep);font-variant-numeric:tabular-nums}
.evrow .when small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.evrow .ic{flex:none;font-size:19px;line-height:1.15}
.evrow .what{flex:1;min-width:0}
.evrow .what b{display:block;overflow-wrap:anywhere;font-size:14px}
.evrow .what small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px dashed currentColor;border-radius:999px;padding:0 7px;margin-top:4px}
.upill{position:absolute;right:12px;bottom:10px;z-index:4;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);border-radius:999px;padding:0 14px;font-size:13px;font-weight:700;min-height:40px;box-shadow:0 3px 10px rgba(122,92,16,.15)}
#upop{position:absolute;right:12px;bottom:58px;z-index:7;width:min(360px,calc(100% - 24px));max-height:62%;overflow-y:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 22px rgba(122,92,16,.25);padding:14px;cursor:default;touch-action:pan-y}
#upop h2{font-size:16px}
#upop .acts{margin-top:8px}
#evd{position:fixed;inset:0;z-index:40;background:rgba(58,46,20,.45);display:flex;align-items:flex-end;justify-content:center}
#evbox{background:var(--paper);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;width:min(480px,100%);max-height:88%;overflow-y:auto;padding:18px 20px 22px}
#evbox .kind{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 6px}
#evbox .dates{margin-top:14px}
@media (min-width:600px){#evd{align-items:center}#evbox{border-radius:20px;border:2px solid var(--gold)}}
@media (min-width:900px){.calcols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}.day{min-height:74px}}
#printout{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{height:auto}
  body{display:block;overflow:visible;background:#fff}
  body>*{display:none!important}
  body>#printout{display:block!important;color:#000;font-family:var(--body)}
  .phead{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:8px}
  .phead img{width:54px;height:54px;border-radius:50%}
  .phead b{font-family:var(--display);font-size:20px;color:var(--gold-deep);letter-spacing:.05em;display:block}
  .phead span{font-size:13px}
  .phead .pm{margin-inline-start:auto;text-align:end;font-family:var(--display);font-size:20px;color:var(--gold-deep)}
  .phead .pm small{display:block;font-family:var(--body);font-size:11px;color:#444}
  .ptab{width:100%;border-collapse:collapse;table-layout:fixed}
  .ptab th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px;border:1px solid #999;background:#f3ecd6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ptab td{border:1px solid #999;vertical-align:top;height:25mm;padding:3px 4px;font-size:9.5px;line-height:1.25;overflow:hidden}
  .ptab td b{font-size:13px}
  .ptab td small{color:#555;font-size:8.5px;margin-left:4px}
  .ptab td div{margin-top:2px;overflow-wrap:anywhere}
  .pfoot{font-size:9px;color:#555;margin-top:6px}
}
/* Language switch and Urdu (right-to-left) */
.lang{position:absolute;top:12px;inset-inline-end:12px;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);border-radius:999px;padding:0 16px;min-height:40px;font-size:15px;font-weight:700}
html[lang="ur"] body{font-size:16px;line-height:1.65}
html[lang="ur"] *{letter-spacing:0!important}
html[lang="ur"] .card .tagline,html[lang="ur"] .card label,html[lang="ur"] .lab,html[lang="ur"] h3,html[lang="ur"] .step,html[lang="ur"] .brand small{font-size:13.5px}
html[lang="ur"] .help,html[lang="ur"] .row small,html[lang="ur"] .evrow .what small{font-size:14px}
html[dir="rtl"] #world{direction:ltr}
html[dir="rtl"] .calnav button:not(.now){transform:scaleX(-1)}
html[dir="rtl"] .x{right:auto;left:10px}
html[dir="rtl"] .head{padding-right:0;padding-left:40px}
html[dir="rtl"] .step{margin:4px 0 6px 40px}
@media (min-width:900px){html[dir="rtl"] .head{padding-left:0}}
</style>

/* dates: month and weekday names */
const URD=(()=>{
  const gm=['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
  const hm=['محرم','صفر','ربیع الاول','ربیع الثانی','جمادی الاول','جمادی الثانی','رجب','شعبان','رمضان','شوال','ذوالقعدہ','ذوالحجہ'];
  const wd=['اتوار','پیر','منگل','بدھ','جمعرات','جمعہ','ہفتہ'];
  const m={AH:'ھ'};
  ['January','February','March','April','May','June','July','August','September','October','November','December'].forEach((n,i)=>{m[n]=gm[i];m[n.slice(0,3)]=gm[i]});
  m.Sept=gm[8];
  ['Muharram','Safar','Rabi al-Awwal','Rabi al-Thani','Jumada al-Awwal','Jumada al-Thani','Rajab','Shaban','Ramadan','Shawwal','Dhul Qadah','Dhul Hijjah'].forEach((n,i)=>{m[n]=hm[i]});
  ['Muh','Safar','Rabi I','Rabi II','Jum I','Jum II','Rajab','Shaban','Ram','Shaw','Dhu Q','Dhu H'].forEach((n,i)=>{m[n]=hm[i]});
  ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].forEach((n,i)=>{m[n]=wd[i];m[n.slice(0,3)]=wd[i]});
  const keys=Object.keys(m).sort((a,b)=>b.length-a.length);
  const re=new RegExp('(^|[^A-Za-z])('+keys.map(k=>k.replace(/[-.]/g,'\\$&')).join('|')+')(?![A-Za-z])','g');
  return {m,re};
})();
// A string made only of numbers, punctuation and date words. Month names alone (no number) count only where "bare" is allowed.
function urDate(s,bare){
  const rest=s.replace(URD.re,'$1');
  if(rest===s||/[A-Za-z]/.test(rest))return null;
  if(!bare&&!/\d/.test(s))return null;
  return s.replace(URD.re,(x,a,k)=>a+URD.m[k]).replace(/,/g,'،');
}

  'great-nephew':'بھتیجے یا بھانجے کا بیٹا','great-niece':'بھتیجے یا بھانجے کی بیٹی','great-nephew or niece':'بھتیجے یا بھانجے کی اولاد',
  husband:'شوہر',wife:'بیوی',spouse:'شریکِ حیات','father-in-law':'سسر','mother-in-law':'ساس','brother-in-law':'برادرِ نسبتی','sister-in-law':'خواہرِ نسبتی'};
function urKin(e){
  const k=e.toLowerCase();let m;
  if(URKIN[k])return URKIN[k];
  if(m=/^(husband|wife|spouse) of your (.+)$/.exec(k)){const x=urKin(m[2]);return x&&x+(m[1]==='wife'?' کی بیوی':m[1]==='husband'?' کے شوہر':' کے شریکِ حیات')}
  if(m=/^(.+) of your (husband|wife|spouse)$/.exec(k)){const x=urKin(m[1]);return x&&(m[2]==='wife'?'بیوی':m[2]==='husband'?'شوہر':'شریکِ حیات')+' کی طرف سے: '+x}
  if(m=/^((?:great-)+)grand(father|mother|parent)$/.exec(k))return 'بزرگ ('+(m[1].length/6+2)+' پشت اوپر)';
  if(m=/^((?:great-)+)grand(son|daughter|child)$/.exec(k))return 'اولاد ('+(m[1].length/6+2)+' پشت نیچے)';
  if(/^(great-)+(uncle|aunt|uncle or aunt)$/.test(k))return 'بزرگ رشتہ دار';
  if(/^(great-)+(nephew|niece|nephew or niece)$/.test(k))return 'بھتیجے یا بھانجے کی اولاد';
  if(m=/^(first|second|third|fourth|fifth|\d+th) cousin(?: (once|twice|\d+ times) removed)?$/.exec(k)){
    const base=m[1]==='first'?'کزن (چچا زاد، پھوپھی زاد، ماموں زاد یا خالہ زاد)':'دور کے کزن';
    return base+(m[2]?' ('+(m[2]==='once'?'ایک':m[2]==='twice'?'دو':m[2].split(' ')[0])+' پشت کے فرق سے)':'')}
  return null;
}

/* ---------- Layout ---------- */
const NW=176,NH=60,GX=18,ROW=124;

// Someone who married into the line on show: their own parents are drawn above them, in the nearest free space of the row above.
let XE=[],UPC=new Set();const hideUp=new Set();      // UPC: people whose parents can be shown above them; hideUp: those folded away

  const free=(d,cx,w)=>{

/* ---------- Pan, pinch, wheel, tap ---------- */
const ptrs=new Map();let moved=false,downTarget=null,pinch=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.search,.ctl,.upill,#upop'))return;
  if(anim)anim.finish();
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false;downTarget=e.target}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};moved=true}
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
});
stage.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){
    if(!moved&&Math.hypot(dx,dy)<6)return;
    moved=true;stage.classList.add('drag');view.x+=dx;view.y+=dy;applyView();
  }
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=stage.getBoundingClientRect();
    zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinch.d);pinch.d=d;
  }
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size)return;
  stage.classList.remove('drag');
  if(!moved&&downTarget&&e.type==='pointerup')tap(downTarget);
  downTarget=null;
}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{if(e.target.closest('#upop'))return;e.preventDefault();if(anim)anim.finish();const r=stage.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0016))},{passive:false});

function tap(target){
  const n=target.closest('.node');
  $('results').classList.remove('on');
  if(!n)return;
  const id=n.dataset.id;
  if(target.closest('[data-tog]')){toggle(id);return}
  if(target.closest('[data-side]')){focus(id,{side:true,expand:true});return}
  if(target.closest('[data-up]')){hideUp.has(id)?hideUp.delete(id):hideUp.add(id);const b=tgt[id];layout();const a=tgt[id];run({k:view.k,x:view.x+(b.x-a.x)*view.k,y:view.y+(b.y-a.y)*view.k});return}
  focus(id,{expand:true});
}

  const before=tgt[id];

  const a=tgt[id];
  run({k:view.k,x:view.x+(before.x-a.x)*view.k,y:view.y+(before.y-a.y)*view.k});

function idLabel(id){
  const p=P[id],f=father(id),m=mother(id),sp=spouses(id);
  const child=p.s==='f'?'daughter of ':p.s==='m'?'son of ':'child of ';
  if(f)return child+P[f].name;
  if(m)return child+P[m].name;
  if(sp.length)return (p.s==='f'?'wife of ':p.s==='m'?'husband of ':'spouse of ')+P[sp[0]].name;
  return p.b?'born '+p.b:'no other details yet';
}
function matchesFor(q,sex,skip){
  const t=q.trim().toLowerCase();if(t.length<2)return [];
  const k=nameKey(t),out=[];
  for(const p of Object.values(P)){
    if(skip.includes(p.id))continue;
    if(sex!=='u'&&p.s!=='u'&&p.s!==sex)continue;
    const n=(p.name+' '+p.known+' '+p.fn).toLowerCase();
    const r=n.startsWith(t)?0:n.includes(t)?1:(k.length>1&&n.split(' ').some(w=>nameKey(w)===k))?2:9;
    if(r<9)out.push([r,p]);
  }
  return out.sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name)).slice(0,5).map(x=>x[1]);
}

    '<button type="button" class="none" data-pick="" data-slot="'+slot+'">None of these, add as new</button>';
}

function unsnap(o){

    const e=$(k);if(!e)continue;
    if(e.type==='checkbox')e.checked=o[k];else e.value=o[k];
  }
}

  const id=await busy(()=>rpc('add_relative',{p_anchor:f.of,p_relation:f.rel,p_given:f.given.trim(),p_family:f.family.trim()||null,p_sex:SEXF[f.sex],p_pending:!!pending,p_other_parent:f.otherParent}));
  if(!id)return;
  await busy(refresh);
  f.newId=id;f.step='born';sel=id;
  const h=host(id);
  if(!h){rootAnchor=id;buildTree()}
  const hh=host(id);reveal(hh);if(TP[hh])expanded.add(TP[hh]);expanded.add(hh);if(f.rel==='child')expanded.add(host(f.of));
  layout();renderSheet();run(viewFor(tgt[id]?id:hh));
}
function afterBorn(){
  const f=flow,p=P[f.newId],now=new Date().getFullYear();
  f.step=(f.rel==='father'||f.rel==='mother'||f.rel==='first'||!p.b||now-p.b>60)?'living':'done';
  layout();run();renderFlow();
}
body.addEventListener('click',async e=>{

  const nx=e.target.closest('[data-next]');if(nx){startFlow(nx.dataset.next,nx.dataset.of);return}
  const fs=e.target.closest('[data-fseg]');
  if(fs){
    const n=fs.dataset.fseg;flow[n]=fs.dataset.v;
    if(n==='ms'&&(flow.ms==='married'||flow.ms==='widowed')&&!flow.spouses.length)flow.spouses.push({k:flow.nk++});
    reform();return;
  }
  const fo=e.target.closest('[data-fopen]');
  if(fo){if(fo.dataset.fopen==='marriage')flow.spouses.push({k:flow.nk++});else flow[fo.dataset.fopen]=true;reform();return}
  const fe=e.target.closest('[data-feng]');if(fe){flow.spouses.find(b=>String(b.k)===fe.dataset.feng).eng=true;reform();return}
  const fp=e.target.closest('[data-fop]');if(fp){flow.otherParent=fp.dataset.fop;reform();return}
  const un=e.target.closest('[data-unpick]');if(un){flow.spouses.find(b=>String(b.k)===un.dataset.unpick).pick=null;reform();return}
  const pk=e.target.closest('[data-pick]');
  if(pk){
    const slot=pk.dataset.slot,id=pk.dataset.pick;
    if(!id){(slot==='main'?$('xsg'):$('sg'+slot)).innerHTML='';return}
    if(slot==='main'){
      const q=P[id];
      flow.snapv=snap();flow.given=$('xgiven').value;flow.family='';
      flow.match={id,full_name:q.name,parents:q.par.map(x=>P[x].name),birth_year:q.b,death_year:q.d,is_living:q.living,spouses:spouses(id).map(x=>P[x].name),children:kids(id).map(x=>first(x))};
      flow.step='dup';renderFlow();
    }else{flow.spouses.find(b=>String(b.k)===slot).pick=id;reform()}

  }
  const ud=e.target.closest('[data-udates]');if(ud){flow={step:'udates',of:sel,sp:ud.dataset.udates};renderSheet();return}

  if(cl){
    const px=cl.dataset.cal,pk=$(px+'_pick'),y=parseInt($(px+'_y').value,10),m=parseInt($(px+'_m').value,10),d=parseInt($(px+'_d').value,10);
    if(y>=1000&&m&&d&&validG(y,m,d))pk.value=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    try{pk.showPicker()}catch(_){pk.classList.add('show');pk.focus()}
    return;
  }
  const f=flow;
  const sx=e.target.closest('[data-sex]');if(sx){keepInputs();f.sex=sx.dataset.sex;renderFlow();return}
  const op=e.target.closest('[data-op]');if(op){keepInputs();f.otherParent=op.dataset.op;renderFlow();return}
  const es=e.target.closest('[data-esex]');if(es){keepInputs();f.esex=es.dataset.esex;renderFlow();restoreEdit();return}
  const el=e.target.closest('[data-eliv]');if(el){keepInputs();f.eliv=el.dataset.eliv;renderFlow();restoreEdit();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='locale-save'){if(await busy(()=>saveLocale('l').then(()=>true))){flow=null;renderSheet();toast('Saved');refreshPill()}}
  else if(a==='locale-later'){flow=null;renderSheet()}
  else if(a==='edit'){openForm({mode:'edit',id:sel})}
  else if(a==='form-save'){await saveForm()}
  else if(a==='photo-soon'){toast('Photos: this feature is coming soon')}
  else if(a==='verify'){const id=sel;if(await busy(()=>rpc('update_person',{p_id:id,p_changes:{status:'verified'}}).then(()=>true))){await busy(refresh);layout();run();renderSheet();toast(first(id)+' is now verified')}}
  else if(a==='line'){(function open(id){expanded.add(id);tkids(id).forEach(open)})(sel);layout();run(viewFor(sel,Math.min(view.k,0.6)));toast('Opened every generation below '+first(sel))}
  else if(a==='side'){focus(sel,{side:true,expand:true})}
  else if(a==='cancel'){flow=null;renderSheet()}
  else if(a==='link-yes'){const lu=linkUser,pid=sel;if(await busy(()=>rpc('link_member',{p_user:lu.id,p_person:pid}).then(()=>true))){linkUser=null;renderSheet();toast(lu.label+' is now connected to '+P[pid].name)}}

  else if(a==='first-save'){
    keepInputs();
    if(f.given.trim().length<2){$('fgiven').focus();toast('Enter a given name to continue',true);return}

    const ms=await busy(()=>rpc('find_matches',{p_name:full,p_sex:SEXF[f.sex],p_exclude:[f.of]}));

  }
  else if(a==='dup-same'){

    const ok=await busy(()=>rpc('link_existing',{p_anchor:f.of,p_relation:f.rel,p_existing:m.id,p_other_parent:f.otherParent}));
    if(!ok)return;
    await busy(refresh);flow=null;focus(m.id,{expand:true});

    let ok;

      let y;try{y=parseYear($('fyear').value,'The birth year')}catch(err){toast(err.message,true);return}

    if(!ok)return;
    await busy(refresh);afterBorn();
  }
  else if(a==='live-yes'){if(await busy(()=>rpc('update_person',{p_id:f.newId,p_changes:{is_living:true}}).then(()=>true))){await busy(refresh);f.step='done';layout();run();renderFlow()}}
  else if(a==='live-no'){if(await busy(()=>rpc('update_person',{p_id:f.newId,p_changes:{is_living:false}}).then(()=>true))){await busy(refresh);f.step='died';layout();run();renderFlow()}}

  else if(a==='died-save'||a==='died-skip'){

      let y;try{y=parseYear($('fyear').value,'The year')}catch(err){toast(err.message,true);return}
      if(!y){toast('Enter a year, or choose I don’t know',true);return}
      ok=await busy(()=>rpc('update_person',{p_id:f.newId,p_changes:{death_year:y}}).then(()=>true));
    }else ok=await busy(()=>rpc('mark_unknown',{p_person:f.newId,p_fact:'death_date'}).then(()=>true));
    if(!ok)return;
    await busy(refresh);f.step='done';layout();run();renderFlow();
  }
  else if(a==='edit-save'){
    const p=P[f.of],ch={},id=f.of;
    const gv=$('egiven').value.trim(),fm=$('efamily').value.trim(),kn=$('eknown').value.trim();
    if(gv.length<2){toast('A given name is needed',true);return}
    if(gv!==p.given)ch.given_name=gv;
    if(fm!==p.family)ch.family_name=fm;
    if(kn!==p.known)ch.known_as=kn;
    if(f.esex!==p.s)ch.sex=SEXF[f.esex];
    const liv=f.eliv==='y'?true:f.eliv==='n'?false:null,was=p.living===undefined?null:p.living;

    const ok=await busy(async()=>{
      if(clearDeath)await rpc('set_person_date',{p_id:id,p_which:'death',p_date:{}});
      if(Object.keys(ch).length)await rpc('update_person',{p_id:id,p_changes:ch});

    await busy(refresh);flow=null;layout();run();renderSheet();toast('Saved');
  }
  else if(a==='dates'){flow={step:'dates',of:sel};renderSheet()}
  else if(a==='dates-save'){
    let b1,d1=null;
    try{b1=readDate('db','Date of birth');if($('dd_y'))d1=readDate('dd','Date of passing')}catch(err){toast(err.message,true);return}
    const id=f.of;
    const ok=await busy(async()=>{
      await rpc('set_person_date',{p_id:id,p_which:'birth',p_date:b1});
      if(d1)await rpc('set_person_date',{p_id:id,p_which:'death',p_date:d1});
      return true});
    if(!ok)return;
    await busy(refresh);flow=null;layout();run();renderSheet();toast('Dates saved');
  }
  else if(a==='udates-save'){
    let e1,m1;
    try{e1=readDate('de','Engagement');m1=readDate('dm','Marriage')}catch(err){toast(err.message,true);return}
    const x=f.of,y=f.sp;
    const ok=await busy(async()=>{
      await rpc('set_union_date',{p_a:x,p_b:y,p_which:'engagement',p_date:e1});
      await rpc('set_union_date',{p_a:x,p_b:y,p_which:'marriage',p_date:m1});
      return true});
    if(!ok)return;
    await busy(refresh);flow=null;layout();run();renderSheet();toast('Dates saved');
  }
  else if(a==='done'){const id=f.newId;flow=null;focus(id,{})}
});
function dateFieldChanged(e){
  if(e.type==='input'&&flow&&flow.step==='form'){
    const t=e.target;
    if(t.id==='xgiven'&&$('xsg'))$('xsg').innerHTML=flow.rel==='first'?'':suggHTML(matchesFor(t.value,flow.sex,[flow.of]),'main');
    const sm=/^sn(\d+)$/.exec(t.id||'');
    if(sm&&$('sg'+sm[1]))$('sg'+sm[1]).innerHTML=suggHTML(matchesFor(t.value,flow.sex==='m'?'f':flow.sex==='f'?'m':'u',[flow.id,flow.of].filter(Boolean)),sm[1]);
  }
  const m=/^([a-z]{2}\d*)_(d|m|y|hd|hm|hy|pick)$/.exec(e.target.id||'');if(!m)return;
  const px=m[1],k=m[2];
  if(k==='pick'){
    const p=/^(\d{4})-(\d{2})-(\d{2})$/.exec(e.target.value||'');if(!p)return;

  else{const n=$(px+'_note');n.dataset.auto='0';n.textContent='Hijri date as entered by you.'}
}

const DAY=86400000,WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const HMS=['Muh','Safar','Rabi I','Rabi II','Jum I','Jum II','Rajab','Shaban','Ram','Shaw','Dhu Q','Dhu H'];

const iso=t=>new Date(t).toISOString().slice(0,10);

const todayT=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const savedMode=()=>{try{return localStorage.getItem('sao-cal')==='hijri'?'hijri':'gregorian'}catch(_){return 'gregorian'}};
let HMC=[],SET=null,CALOK=false,EVREG=[];      // HMC: Hijri months sent by the database
const CAL={mode:savedMode(),y:0,m:0,hy:0,hm:0,type:'all',range:'month',pick:null,ev:[],list:[],up:[]};
function addMonths(ms){
  for(const m of ms||[])if(!HMC.some(x=>x.hy===m.hy&&x.hm===m.hm))HMC.push({hy:m.hy,hm:m.hm,t:pd(m.starts),days:m.days,adj:m.adj,def:m.def||0,mine:!!m.mine});
  HMC.sort((a,b)=>a.t-b.t);
}
const hOf=t=>{for(const m of HMC)if(t>=m.t&&t<m.t+m.days*DAY)return {y:m.hy,m:m.hm,d:Math.round((t-m.t)/DAY)+1};return null};
const hMonth=(hy,hm)=>HMC.find(m=>m.hy===hy&&m.hm===hm)||null;
const gT=(t,long)=>{const d=new Date(t);return d.getUTCDate()+' '+(long?GM[d.getUTCMonth()]+' '+d.getUTCFullYear():GM[d.getUTCMonth()].slice(0,3))};
const hT=(t,long)=>{const h=hOf(t);return h?h.d+' '+(long?HM[h.m-1]+' '+h.y+' AH':HMS[h.m-1]):''};
const longG=o=>o&&o.m?(o.d?o.d+' ':'')+GM[o.m-1]+(o.y?' '+o.y:''):'';
const longH=o=>o&&o.m?(o.d?o.d+' ':'')+HM[o.m-1]+(o.y?' '+o.y+' AH':''):'';

function evRow(e,grouped){
  const f=e.kind==='fatiha',i=EVREG.push(e)-1,hij=CAL.mode==='hijri';
  const a=hij?hT(e.t):gT(e.t),b=hij?gT(e.t):hT(e.t);
  const other=e.only&&e.cal!==CAL.mode?'<span class="tag">'+(e.cal==='hijri'?'Hijri date':'Gregorian date')+'</span>':'';
  const turn=!f&&e.years>0?'Turns '+e.years:'';

/* Calendar file (.ics) for Apple, Google, Outlook, Samsung and other calendar apps */
const icsText=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){          // no line longer than 75 bytes
  const enc=new TextEncoder();let out='',cur='',n=0;
  for(const ch of line){const b=enc.encode(ch).length;if(n+b>73){out+=cur+'\r\n ';cur='';n=1}cur+=ch;n+=b}
  return out+cur;
}
async function buildICS(){
  const t=todayT(),ymd=x=>iso(x).replace(/-/g,'');
  const g=await loadEvents(t,t+365*DAY,'gregorian'),h=await loadEvents(t,t+1825*DAY,'hijri');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Shajare Ahmed Online//Family Calendar//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Shajare Ahmed Family Calendar'];
  let n=0;
  const add=(e,uid,rule,note)=>{
    const f=e.kind==='fatiha',desc=[];
    if(longG(e.g))desc.push((f?'Death date: ':'Date of birth: ')+longG(e.g));
    if(longH(e.h))desc.push('Hijri date: '+longH(e.h));
    if(note)desc.push(note);
    L.push('BEGIN:VEVENT','UID:'+uid+'@shajareahmed.online','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+ymd(e.t),'DTEND;VALUE=DATE:'+ymd(e.t+DAY));
    if(rule)L.push(rule);
    L.push('SUMMARY:'+icsText((f?'Request for Surah Al-Fatiha: ':'Birthday: ')+e.line+(e.cal==='hijri'?' (Hijri date)':'')),'DESCRIPTION:'+icsText(desc.join('\n')),'CATEGORIES:'+(f?'Death Anniversary':'Birthday'),'TRANSP:TRANSPARENT','END:VEVENT');
    n++;
  };
  const seen=new Set();
  for(const e of g){const k=e.kind+'-g-'+e.person_id;if(seen.has(k))continue;seen.add(k);
    add(e,k,e.g&&e.g.m===2&&e.g.d===29?'RRULE:FREQ=YEARLY;BYMONTH=2;BYMONTHDAY=-1':'RRULE:FREQ=YEARLY')}
  for(const e of h)add(e,e.kind+'-h-'+e.person_id+'-'+ymd(e.t),null,'Hijri anniversary');
  L.push('END:VCALENDAR');
  return {text:L.map(icsFold).join('\r\n')+'\r\n',n};
}

  if(!me){await showAccess();return}
  dropInvite();dropJoin();
  ME=me.person_id||null;ROLE=me.role;
  try{await refresh()}catch(e){showGate('login',String(e.message||e),true);return}
  myClaim=null;
  if(!ME){try{const c=await rpc('my_claim');if(c&&c.status==='pending'&&P[c.person_id])myClaim=c}catch(_){}}
  expanded.clear();
  const home=ME||ROOT;
  if(home){let c=home;expanded.add(c);while(TP[c]){c=TP[c];expanded.add(c)}}
  const fam=ME?familyOf(ME):null;
  $('mmembers').hidden=!(ROLE==='admin'||ROLE==='moderator');linkUser=null;setContrib(false,true);
  await loadSettings();
  // asked once, on the first sign-in: country of residence, for local dates and reminders
  if(SET&&!SET.country&&!localeAsked()&&Object.keys(P).length){flow={step:'locale'};try{localStorage.setItem('sao-locale-asked','1')}catch(_){}}
  layout();sel=desktop()?home:null;renderSheet();
  cur={};for(const id in tgt)cur[id]={x:tgt[id].x,y:tgt[id].y};
  gate.hidden=true;
  syncEls();if(home)view=(fam&&fitTo(fam))||viewFor(home,desktop()?0.95:0.85);draw();
  if(ME&&Object.keys(P).length===1){sel=ME;renderSheet();run(viewFor(ME));toast('Welcome. Choose Contribute to start adding your family.')}
  refreshPill();
}
async function signOut(){if(sb)await sb.auth.signOut();for(const id in els){els[id].remove();delete els[id]}P={};tgt={};cur={};epath.setAttribute('d','');sel=null;flow=null;linkUser=null;myClaim=null;sheet.classList.remove('on');$('upill').hidden=true;$('upop').hidden=true;$('cal').hidden=true;$('evd').hidden=true;HMC=[];SET=null;CALOK=false;showGate('login','')}
$('out').addEventListener('click',signOut);$('out2').addEventListener('click',signOut);
function authMsg(error){
  const m=(error&&error.message)||'';
  if(/invalid login credentials/i.test(m))return 'That email and password do not match. Check both, or use Forgot password? to set a new one.';
  if(/not confirmed/i.test(m))return 'This email address has not been confirmed yet. Ask the family admin to confirm it.';
  if(/already registered|already been registered|already exists/i.test(m))return 'That email already has a login. Log in instead, or use Forgot password? to set a new password.';
  if(/rate limit|security purposes|too many/i.test(m))return 'Too many attempts just now. Please wait a few minutes and try again.';
  if(/fetch|network|load failed/i.test(m))return 'Could not reach the sign-in service. Check your internet connection. If this page is open inside a preview window, open the file in Chrome or Edge instead.';
  return m||'Something went wrong. Please try again.';
}
// Buttons act on click, not on form submission, so they work even where a window blocks forms.
let signing=false;
async function doLogin(){
  if(signing)return;
  const em=$('email').value.trim(),pw=$('pass').value;
  if(!/^\S+@\S+\.\S+$/.test(em)){showGate('login','Enter your email address.',true);return}
  if(!pw){showGate('login','Enter your password.',true);return}
  signing=true;
  try{await doLoginInner(em,pw)}finally{signing=false}
}
async function doLoginInner(em,pw){
  const btn=$('loginbtn');btn.disabled=true;showGate('login','Signing in…');
  let r;try{r=await sb.auth.signInWithPassword({email:em,password:pw})}catch(err){r={error:err}}
  btn.disabled=false;
  if(r.error){showGate('login',authMsg(r.error),true);return}
  $('pass').value='';
  enter();
}
$('loginbtn').addEventListener('click',doLogin);
$('login').addEventListener('submit',e=>e.preventDefault());
$('login').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();doLogin()}});
/* Forgot password: a code is emailed, then a new password is set here. No web address needed. */
let rstep=1;
function showReset(step,msg,isErr){
  rstep=step;showGate('reset',msg,isErr);
  $('rs1').hidden=step!==1;$('rs2').hidden=step!==2;
  $('resethelp').textContent=step===1?'Enter your email and we will send you a code to set a new password.':'Enter the code sent to '+$('remail').value.trim()+' and choose a new password.';
}
async function sendCode(){
  const em=$('remail').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){showReset(1,'Enter your email address.',true);return}
  $('rsend').disabled=true;showReset(1,'Sending…');
  let r;try{r=await sb.auth.resetPasswordForEmail(em)}catch(err){r={error:err}}
  $('rsend').disabled=false;
  if(r.error){showReset(1,authMsg(r.error),true);return}
  $('rcode').value='';$('rpass').value='';$('rpass2').value='';
  showReset(2,'If that email belongs to a member, a code is on its way. Check the junk folder too.');
}
async function setNewPassword(){
  const em=$('remail').value.trim(),code=$('rcode').value.replace(/\D/g,''),p1=$('rpass').value,p2=$('rpass2').value;
  if(code.length<6){showReset(2,'Enter the code from the email.',true);return}
  if(p1.length<8){showReset(2,'Choose a password of at least 8 characters.',true);return}
  if(p1!==p2){showReset(2,'The two passwords are not the same.',true);return}
  $('rsave').disabled=true;showReset(2,'Checking the code…');
  let r;try{r=await sb.auth.verifyOtp({email:em,token:code,type:'recovery'})}catch(err){r={error:err}}
  if(r.error){$('rsave').disabled=false;showReset(2,/fetch|network/i.test(r.error.message||'')?authMsg(r.error):'That code is not right or has expired. Use Send a new code and try again.',true);return}
  try{r=await sb.auth.updateUser({password:p1})}catch(err){r={error:err}}
  $('rsave').disabled=false;
  if(r.error){showReset(2,authMsg(r.error),true);return}
  $('rpass').value='';$('rpass2').value='';$('rcode').value='';
  enter();
}
async function showAccess(){
  let acc=null;
  try{
    acc=await rpc('my_access');
    if(!acc){
      let nm='',ab='';
      try{const u=(await sb.auth.getUser()).data.user;nm=(u.user_metadata&&u.user_metadata.full_name)||u.email||'';ab=(u.user_metadata&&u.user_metadata.about)||''}catch(_){}
      acc=await rpc('request_access',{p_name:nm||'New member',p_about:ab||null});
    }
  }catch(e){showGate('login',String(e.message||e),true);return}
  const st=acc&&acc.status;
  $('pendtxt').textContent=st==='declined'?'Your request to join was not approved. If you think this is a mistake, please contact a family admin.':
    st==='approved'?'Your access is switched off at the moment. Please contact a family admin.':
    'Thank you'+(acc&&acc.full_name?', '+acc.full_name:'')+'. Your request to join is with the family admins. You will be able to enter as soon as it is approved.';
  showGate('notmember',inviteErr,true);inviteErr='';
}
$('pcheck').addEventListener('click',()=>enter());
$('toreg').addEventListener('click',()=>{$('gemail').value=$('email').value;showGate('register','')});
$('regback').addEventListener('click',()=>showGate('login',''));
let registering=false;
async function doRegister(){
  if(registering)return;
  const nm=$('gname').value.trim(),em=$('gemail').value.trim(),pw=$('gpass').value,ab=$('gabout').value.trim();
  if(nm.length<2){showGate('register','Enter your full name.',true);return}
  if(!/^\S+@\S+\.\S+$/.test(em)){showGate('register','Enter your email address.',true);return}
  if(pw.length<8){showGate('register','Choose a password of at least 8 characters.',true);return}
  registering=true;$('regbtn').disabled=true;showGate('register','Sending your request…');
  let r;try{r=await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:nm,about:ab}}})}catch(err){r={error:err}}
  registering=false;$('regbtn').disabled=false;
  if(r.error){showGate('register',authMsg(r.error),true);return}
  $('gpass').value='';
  if(r.data&&r.data.session){enter();return}
  $('email').value=em;
  showGate('login','Almost done. We sent a confirmation email to '+em+'. Open it, then log in here.');
}
$('regbtn').addEventListener('click',doRegister);
$('register').addEventListener('submit',e=>e.preventDefault());
$('register').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();doRegister()}});
$('forgot').addEventListener('click',()=>{$('remail').value=$('email').value;showReset(1,'')});
$('rback').addEventListener('click',()=>showGate('login',''));
$('rresend').addEventListener('click',sendCode);
$('rsend').addEventListener('click',sendCode);
$('rsave').addEventListener('click',setNewPassword);
$('reset').addEventListener('submit',e=>e.preventDefault());
$('reset').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();rstep===1?sendCode():setNewPassword()}});
(async function start(){
  if(TEST){enter();return}
  if(!window.supabase){showGate('wait','Could not reach the sign-in service. Check your internet connection and reload.',true);return}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  const {data}=await sb.auth.getSession();
  if(data&&data.session)enter();
  else if(inviteTok||joinTok)showGate('register','You have been invited to join. Create your login below.');
  else showGate('login','');
})();
</script>
