<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F6F1E1">
<title>Shajare Ahmed Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one full-bleed map canvas; search and controls float on it; details rise as a sheet (phone) or sit in a side panel (desktop). */
  --ivory:#F6F1E1;
  --paper:#FFFDF6;
  --gold:#B8901F;
  --gold-hi:#E6CB72;
  --gold-deep:#7A5C10;
  --ink:#3A2E14;
  --muted:#7C6F52;
  --line:#DCCB95;
  --ok:#2F6B4F;
  --warn:#9A5B13;
  --bad:#9B2C2C;
  --display:"Cinzel","Trajan Pro","Cormorant SC",Georgia,serif;
  --body:"Nunito Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
[hidden]{display:none!important}

/* Sign-in */
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 25%,#FFFDF4 0,var(--ivory) 70%);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.card{width:min(400px,100%);text-align:center}
.card img{width:132px;height:132px;border-radius:50%;object-fit:cover;mix-blend-mode:multiply}
.card h1{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:.05em;color:var(--gold-deep);margin:6px 0 2px;text-wrap:balance}
.card .tagline{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 22px}
.card form{display:flex;flex-direction:column;gap:10px;text-align:left}
.card label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.msg{min-height:20px;font-size:13.5px;color:var(--bad);margin:4px 0 0;text-align:center}
.msg{font-weight:700}
.msg.info{color:var(--muted);font-weight:400}
.ver{font-size:11px;color:var(--muted);margin:18px 0 0;letter-spacing:.08em}

/* Header */
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.bar img{width:36px;height:36px;border-radius:50%;object-fit:cover;mix-blend-mode:multiply}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--gold-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out{margin-left:auto;flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}

main{flex:1;min-height:0;display:flex;position:relative}

/* Canvas */
#stage{flex:1;min-width:0;position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(circle at 50% 30%, #FFFDF4 0, rgba(255,253,244,0) 60%),
    radial-gradient(var(--line) 1px, transparent 1.2px) 0 0/26px 26px,
    var(--ivory)}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;opacity:.75}

.node{position:absolute;left:0;top:0;width:176px;height:60px;display:flex;align-items:center;gap:9px;padding:0 12px 0 7px;background:var(--paper);border:1.5px solid var(--line);border-radius:30px;box-shadow:0 2px 6px rgba(122,92,16,.10);cursor:pointer}
.node.unv{border-style:dashed;border-color:var(--gold)}
.node.me{border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,203,114,.55),0 2px 8px rgba(122,92,16,.18)}
.node.sel{border-color:var(--gold-deep);border-style:solid;box-shadow:0 0 0 4px rgba(184,144,31,.35),0 6px 16px rgba(122,92,16,.25)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0)}
.av b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ivory);font-family:var(--display);font-weight:700;font-size:13px;color:var(--gold-deep);letter-spacing:.03em}
.tx{min-width:0;display:flex;flex-direction:column}
.nm{font-weight:700;font-size:13.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sb{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.gem{position:absolute;right:9px;top:-6px;width:11px;height:11px;transform:rotate(45deg);background:linear-gradient(135deg,#fff,var(--gold-hi) 55%,var(--gold));border:1px solid var(--gold-deep);border-radius:2px}
.you{position:absolute;left:14px;top:-9px;background:var(--gold-deep);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:999px}
.tog{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);min-width:26px;height:24px;padding:0 7px;border-radius:999px;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);font-size:11.5px;font-weight:700;line-height:1;display:flex;align-items:center;gap:3px;z-index:2}
.tog.open{background:var(--gold);color:#fff}
.tog::before{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor}
.tog.open::before{transform:rotate(180deg)}
.blabel{display:none;position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--gold-deep);font-size:calc(13px*var(--inv,1));text-shadow:0 0 6px var(--ivory),0 0 6px var(--ivory)}
#stage[data-z="far"] .blabel.on{display:block}
#stage[data-z="far"] .sb,#stage[data-z="mid"] .sb{display:none}
#stage[data-z="far"] .tog,#stage[data-z="far"] .gem,#stage[data-z="far"] .you{display:none}

/* Floating search and controls */
.search{position:absolute;left:12px;top:12px;width:min(340px,calc(100% - 80px));z-index:5}
.search input{width:100%;height:44px;border-radius:22px;border:1.5px solid var(--gold);background:var(--paper);padding:0 16px;box-shadow:0 3px 10px rgba(122,92,16,.15)}
.search input::placeholder{color:var(--muted)}
.results{margin-top:6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 22px rgba(122,92,16,.2);overflow:hidden;display:none;max-height:260px;overflow-y:auto}
.results.on{display:block}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ivory);padding:9px 14px;min-height:44px}
.results button small{display:block;color:var(--muted);font-size:11.5px}
.results p{margin:0;padding:12px 14px;color:var(--muted)}
.ctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
.ctl button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);font-size:21px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 3px 10px rgba(122,92,16,.15)}
.ctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.note{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--muted);background:rgba(255,253,246,.85);border-radius:999px;padding:3px 10px;z-index:1;pointer-events:none}
.toast{position:absolute;left:50%;top:68px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13.5px;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.toast.err{background:var(--bad)}

/* Sheet (phone) / side panel (desktop) */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:66%;background:var(--paper);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;box-shadow:0 -8px 28px rgba(122,92,16,.22);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:8;display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheet.busy{pointer-events:none;opacity:.7}
#sheet::before{content:"";flex:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--ivory);font-size:18px;line-height:1;color:var(--muted);z-index:1}
#body{overflow-y:auto;padding:10px 18px 22px;-webkit-overflow-scrolling:touch}
.head{display:flex;gap:14px;align-items:center;padding-right:40px}
.head .av{width:64px;height:64px}.head .av b{width:54px;height:54px;font-size:18px}
h2{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;margin:0;color:var(--gold-deep);text-wrap:balance;overflow-wrap:anywhere}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;border:1px solid var(--line);background:var(--ivory)}
.pill.ok{color:var(--ok);border-color:currentColor;background:none}
.pill.wn{color:var(--warn);border-color:currentColor;border-style:dashed;background:none}
.pill.rel{color:var(--gold-deep);border-color:var(--gold)}
.comp{margin:12px 0;font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-hi),var(--gold))}
h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--ivory);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;min-height:36px}
.chip.add{border-style:dashed;border-color:var(--gold);background:none;color:var(--gold-deep)}
.chip.on{background:var(--gold);border-color:var(--gold-deep);color:#fff}
.none{color:var(--muted);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--gold);background:var(--paper);color:var(--gold-deep);font-weight:700;font-size:14px}
.btn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold-deep);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.btn.txt{border-color:transparent;background:none;color:var(--muted)}
.btn.wide{width:100%}
.step{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:4px 40px 6px 0}
.q{font-family:var(--display);font-weight:700;font-size:18px;color:var(--gold-deep);margin:0 0 12px;letter-spacing:.03em;text-wrap:balance}
.field{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--gold);background:#fff;padding:0 14px;font-size:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:-6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--ivory);font-weight:700}
.seg button.on{border-color:var(--gold-deep);background:var(--gold);color:#fff}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.match{border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;background:var(--ivory);margin-bottom:4px}
.match dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:13px}
.match dt{color:var(--muted)}.match dd{margin:0;font-weight:600}
.help{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.empty{display:none}

@media (min-width:900px){
  #sheet{position:static;transform:none;transition:none;width:390px;max-height:none;flex:none;border-top:0;border-left:1px solid var(--line);border-radius:0;box-shadow:none}
  #sheet::before{display:none}
  .x{display:none}
  #body{padding:22px 24px}
  .head{padding-right:0}
  .empty{display:block}
  .brand b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){#sheet,.toast{transition:none}}
</style>
</head>

const mother=id=>P[id].par.find(x=>P[x].s==='f');
const siblings=id=>{const s=new Set();for(const p of P[id].par)for(const k of kids(p))if(k!==id)s.add(k);return [...s]};
function rootFor(id){let c=id;const seen=new Set();while(!seen.has(c)){seen.add(c);const p=father(c)||P[c].par[0];if(!p)break;c=p}return c}
function defaultRoot(){ // admin-only login has no place in the tree: show the largest family line
  let best=null,bn=-1;
  for(const p of Object.values(P)){
    if(p.par.length)continue;
    const seen=new Set([p.id]),q=[p.id];
    while(q.length)for(const k of kids(q.shift()))if(!seen.has(k)){seen.add(k);q.push(k)}
    if(seen.size>bn||(seen.size===bn&&p.s==='m'&&P[best].s!=='m')){bn=seen.size;best=p.id}
  }
  return best;
}
function buildTree(){
  if(rootAnchor&&!P[rootAnchor])rootAnchor=null;
  if(ME&&!P[ME])ME=null;
  const a=rootAnchor||ME||defaultRoot();
  TREE=new Set();TP={};ROOT=null;
  if(!a)return;
  ROOT=rootFor(a);
  TREE=new Set([ROOT]);const q=[ROOT];
  while(q.length){const c=q.shift();for(const k of kids(c))if(!TREE.has(k)){TREE.add(k);q.push(k)}}
  TP={};
  for(const id of TREE){if(id===ROOT)continue;const f=father(id);TP[id]=f&&TREE.has(f)?f:P[id].par.find(x=>TREE.has(x))}
}
const tkids=id=>kids(id).filter(k=>TP[k]===id);
const inTree=id=>TREE.has(id);
const host=id=>!id||!P[id]?null:(inTree(id)?id:(spouses(id).find(inTree)||null));
const first=id=>P[id].given;
function descCount(id,seen){seen=seen||new Set();let n=0;for(const k of tkids(id))if(!seen.has(k)){seen.add(k);n+=1+descCount(k,seen)}return n}
function ancMap(id){const m=new Map([[id,{d:0,first:null}]]),q=[id];while(q.length){const c=q.shift(),e=m.get(c);for(const p of P[c].par)if(!m.has(p)){m.set(p,{d:e.d+1,first:e.first||p});q.push(p)}}return m}
function blood(a,b){const A=ancMap(a),B=ancMap(b);let best=null;for(const [k,v] of A){const w=B.get(k);if(w&&(!best||v.d+w.d<best.d1+best.d2))best={d1:v.d,d2:w.d,first:v.first}}return best}
const greats=n=>n>0?'Great-'.repeat(n):'';
const ORD=['','First','Second','Third','Fourth','Fifth'];
const g3=(s,m,f,n)=>s==='m'?m:s==='f'?f:n;
function bloodName(me,x){
  const r=blood(me,x);if(!r)return null;
  const s=P[x].s,{d1,d2}=r;
  if(d1===0&&d2===0)return 'You';
  if(d2===0)return d1===1?g3(s,'Father','Mother','Parent'):greats(d1-2)+g3(s,'Grandfather','Grandmother','Grandparent');
  if(d1===0)return d2===1?g3(s,'Son','Daughter','Child'):greats(d2-2)+g3(s,'Grandson','Granddaughter','Grandchild');
  if(d1===1&&d2===1)return g3(s,'Brother','Sister','Sibling');
  if(d2===1){
    if(d1===2){const ps=P[r.first].s,base=g3(s,'Uncle','Aunt','Uncle or aunt');
      const ur=ps==='m'?g3(s,'Chacha / Taya','Phuphi',''):ps==='f'?g3(s,'Mamu','Khala',''):'';
      return base+(ur?' ('+ur+')':'')}
    return greats(d1-2)+g3(s,'Uncle','Aunt','Uncle or aunt');
  }
  if(d1===1)return greats(d2-2)+g3(s,'Nephew','Niece','Nephew or niece');
  const deg=Math.min(d1,d2)-1,rem=Math.abs(d1-d2);
  return (ORD[deg]||deg+'th')+' cousin'+(rem?(rem===1?' once removed':rem===2?' twice removed':' '+rem+' times removed'):'');
}
function relName(me,x){
  if(!me||!P[me])return null;
  const b=bloodName(me,x);if(b)return b;
  const s=P[x].s;
  if(spouses(x).includes(me))return g3(s,'Husband','Wife','Spouse');
  for(const sp of spouses(x)){const r=bloodName(me,sp);if(r)return g3(s,'Husband','Wife','Spouse')+' of your '+r.replace(/ \(.*\)/,'').toLowerCase()}
  for(const sp of spouses(me)){const r=bloodName(sp,x);if(r)return /^(Father|Mother|Brother|Sister)$/.test(r)?r+'-in-law':r.replace(/ \(.*\)/,'')+' of your '+g3(P[sp].s,'husband','wife','spouse')}
  return null;
}
function completeness(id){
  const p=P[id];
  const items=[['a birth year',!!p.b],['whether living or passed away',p.living!==null&&p.living!==undefined],['parents',p.par.length>0],['a photo',!!p.photo],['moderator verification',p.v]];
  const done=items.filter(i=>i[1]).length;
  return {pct:Math.round(done/items.length*100),next:(items.find(i=>!i[1])||[])[0]};
}
const years=p=>{const a=p.b?((p.bp==='about'||p.bp==='decade')?'c. ':'')+p.b:'';if(p.d)return (a||'?')+'–'+p.d;if(p.living===false)return (a?'b. '+a+' · ':'')+'passed away';return a?'b. '+a:'Dates not recorded'};
const initials=p=>((p.given[0]||'')+(p.family?p.family[0]:(p.given.split(' ')[1]||'')[0]||'')).toUpperCase();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameKey=n=>{const t=n.trim().toLowerCase().split(/\s+/).filter(w=>!/^(syed|sayed|saiyed|sayyid|mirza)$/.test(w))[0]||'';return t[0]?t[0]+t.slice(1).replace(/[aeiouy]/g,'').replace(/(.)\1+/g,'$1'):''};

/* ---------- Layout ---------- */
const NW=176,NH=60,GX=18,ROW=124;
const expanded=new Set();
let tgt={},tp={},Wd={},cur={},view={x:0,y:0,k:1},anim=null,sel=null,flow=null;
function measure(id){const ks=expanded.has(id)?tkids(id):[];let w=NW;if(ks.length)w=Math.max(NW,ks.map(measure).reduce((a,b)=>a+b,0)+GX*(ks.length-1));return Wd[id]=w}
function place(id,left,depth,parent){
  tgt[id]={x:left+Wd[id]/2,y:depth*ROW,d:depth};tp[id]=parent;
  if(!expanded.has(id))return;
  const ks=tkids(id);if(!ks.length)return;
  let cl=left+(Wd[id]-(ks.reduce((a,k)=>a+Wd[k],0)+GX*(ks.length-1)))/2;
  for(const k of ks){place(k,cl,depth+1,id);cl+=Wd[k]+GX}
}
function layout(){tgt={};tp={};Wd={};if(ROOT){measure(ROOT);place(ROOT,0,0,null)}}

/* ---------- Rendering ---------- */
const $=id=>document.getElementById(id);
const stage=$('stage'),world=$('world'),epath=$('epath'),sheet=$('sheet'),body=$('body');
const els={};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const desktop=()=>matchMedia('(min-width:900px)').matches;
function nodeHTML(id){
  const p=P[id],n=tkids(id).length,sp=spouses(id),c=completeness(id);
  const sub=esc(years(p))+(sp.length?' · & '+esc(first(sp[0])):'');
  return '<span class="blabel'+(tgt[id].d<=1?' on':'')+'">'+esc(first(id))+'’s line · '+(descCount(id)+1)+'</span>'+
    '<span class="av" style="--p:'+c.pct+'"><b>'+esc(initials(p))+'</b></span>'+
    '<span class="tx"><span class="nm">'+esc(p.name)+'</span><span class="sb">'+sub+'</span></span>'+
    (p.v?'<i class="gem" title="Verified"></i>':'')+(id===ME?'<span class="you">You</span>':'')+
    (n?'<button class="tog'+(expanded.has(id)?' open':'')+'" data-tog="1" aria-label="'+(expanded.has(id)?'Collapse':'Expand')+' children">'+n+'</button>':'');
}
function syncEls(){
  for(const id in els)if(!tgt[id]){els[id].remove();delete els[id]}
  const selHost=sel&&P[sel]?host(sel):null;
  for(const id in tgt){
    let el=els[id];
    if(!el){el=els[id]=document.createElement('div');el.dataset.id=id;el.tabIndex=0;el.setAttribute('role','button');world.appendChild(el)}
    el.className='node'+(P[id].v?'':' unv')+(id===ME?' me':'')+(id===selHost?' sel':'');
    el.innerHTML=nodeHTML(id);
  }
}
function draw(){
  let d='';
  for(const id in cur){
    const c=cur[id],el=els[id];if(!el)continue;
    el.style.transform='translate('+(c.x-NW/2)+'px,'+c.y+'px)';
    const pr=tp[id];
    if(pr&&cur[pr]){const a=cur[pr],y1=a.y+NH,y2=c.y,my=(y1+y2)/2;d+='M'+a.x+','+y1+'C'+a.x+','+my+' '+c.x+','+my+' '+c.x+','+y2}
  }
  epath.setAttribute('d',d);
  applyView();
}
function applyView(){
  world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.k+')';
  world.style.setProperty('--inv',(1/view.k).toFixed(3));
  stage.dataset.z=view.k<0.5?'far':view.k<0.8?'mid':'near';
}
function run(viewTo,dur){
  if(anim)anim.finish();
  dur=reduce?0:(dur==null?380:dur);
  const from={};
  for(const id in tgt)from[id]=cur[id]?cur[id]:(tp[id]&&cur[tp[id]]?cur[tp[id]]:tgt[id]);
  const vf={...view},vt=viewTo||vf,t0=performance.now();
  syncEls();
  const set=e=>{cur={};for(const id in tgt){const a=from[id],b=tgt[id];cur[id]={x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e}}view={x:vf.x+(vt.x-vf.x)*e,y:vf.y+(vt.y-vf.y)*e,k:vf.k+(vt.k-vf.k)*e};draw()};
  const my=anim={finish(){if(anim===my){anim=null;set(1)}}};
  if(!dur){my.finish();return}
  set(0);
  (function step(){if(anim!==my)return;const t=Math.min(1,(performance.now()-t0)/dur);set(1-Math.pow(1-t,3));if(t<1)requestAnimationFrame(step);else anim=null})();
}
function frame(){
  const w=stage.clientWidth,h=stage.clientHeight;
  const cover=(!desktop()&&sheet.classList.contains('on'))?Math.min(sheet.offsetHeight,h*0.66):0;
  return {w,h:Math.max(140,h-cover)};
}
function viewFor(id,k){const f=frame(),t=tgt[id];k=k||Math.max(view.k,0.85);return {k,x:f.w/2-t.x*k,y:Math.max(70,f.h/2-NH/2*k+18)-t.y*k}}
function reveal(id){let c=TP[id];while(c){expanded.add(c);c=TP[c]}}
function focus(id,opts){
  opts=opts||{};
  if(!P[id])return;
  if(!host(id)){rootAnchor=id;buildTree();cur={};toast('Showing '+first(id)+'’s side of the family. Use the Home button to return.')}
  const h=host(id);
  reveal(h);if(opts.expand)expanded.add(h);
  sel=id;if(!opts.keepFlow)flow=null;
  layout();renderSheet();
  run(viewFor(h,opts.k));
}
function fitAll(){
  layout();
  let x0=1e9,x1=-1e9,y1=0;for(const id in tgt){x0=Math.min(x0,tgt[id].x-NW/2);x1=Math.max(x1,tgt[id].x+NW/2);y1=Math.max(y1,tgt[id].y+NH)}
  const f=frame(),k=Math.max(0.18,Math.min(1,(f.w-32)/(x1-x0),(f.h-110)/y1));
  run({k,x:(f.w-(x0+x1)*k)/2,y:70});
}
function zoomAt(cx,cy,fac){const k=Math.max(0.18,Math.min(2.2,view.k*fac));view={k,x:cx-(cx-view.x)*(k/view.k),y:cy-(cy-view.y)*(k/view.k)};applyView()}
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='toast on'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),err?6500:3200)}
function note(){$('note').textContent=Object.keys(P).length+(Object.keys(P).length===1?' person':' people')+' in the archive'}

/* ---------- Pan, pinch, wheel, tap ---------- */
const ptrs=new Map();let moved=false,downTarget=null,pinch=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('.search,.ctl'))return;
  if(anim)anim.finish();
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){moved=false;downTarget=e.target}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};moved=true}
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
});
stage.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){
    if(!moved&&Math.hypot(dx,dy)<6)return;
    moved=true;stage.classList.add('drag');view.x+=dx;view.y+=dy;applyView();
  }
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2&&pinch){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=stage.getBoundingClientRect();
    zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinch.d);pinch.d=d;
  }
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size)return;
  stage.classList.remove('drag');
  if(!moved&&downTarget&&e.type==='pointerup')tap(downTarget);
  downTarget=null;
}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();if(anim)anim.finish();const r=stage.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0016))},{passive:false});
stage.addEventListener('keydown',e=>{const n=e.target.closest&&e.target.closest('.node');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tap(e.target)}});
function tap(target){
  const n=target.closest('.node');
  $('results').classList.remove('on');
  if(!n)return;
  const id=n.dataset.id;
  if(target.closest('[data-tog]')){toggle(id);return}
  focus(id,{expand:true});
}
function toggle(id){
  const before=tgt[id];
  expanded.has(id)?expanded.delete(id):expanded.add(id);
  layout();
  const a=tgt[id];
  run({k:view.k,x:view.x+(before.x-a.x)*view.k,y:view.y+(before.y-a.y)*view.k});
}

/* ---------- Loading and saving ---------- */
async function refresh(){
  ingest(await rpc('tree_snapshot'));
  if(sel&&!P[sel])sel=null;
  buildTree();note();
}
async function busy(fn){
  sheet.classList.add('busy');

  finally{sheet.classList.remove('busy')}

const who=id=>id===ME?'your':esc(first(id))+'’s';

/* ---------- Guided entry ---------- */
const QUESTION={
  father:id=>'Who is '+who(id)+' father?',
  mother:id=>'Who is '+who(id)+' mother?',
  spouse:id=>id===ME?'Who are you married to?':'Who is '+esc(first(id))+' married to?',
  child:id=>'What is the name of '+who(id)+' child?',
  sibling:id=>'What is the name of '+who(id)+' brother or sister?'
};
const RELWORD={father:'father',mother:'mother',spouse:'spouse',child:'child',sibling:'brother or sister'};
function startFlow(rel,of){
  const o=P[of],f=father(of);
  flow={rel,of,step:'name',given:'',family:'',est:false,otherParent:null,
    sex:rel==='father'?'m':rel==='mother'?'f':rel==='spouse'?(o.s==='m'?'f':o.s==='f'?'m':'u'):'m'};
  if(rel==='child')flow.family=o.s==='m'?o.family:(spouses(of)[0]?P[spouses(of)[0]].family:'');
  if(rel==='sibling')flow.family=o.family;
  if(rel==='child'&&spouses(of).length>1)flow.otherParent=spouses(of)[0];
  renderSheet();
}
function seg(name,opts,val){return '<div class="seg">'+opts.map(o=>'<button type="button" data-'+name+'="'+o[0]+'" class="'+(val===o[0]?'on':'')+'">'+o[1]+'</button>').join('')+'</div>'}
function renderFlow(){
  const f=flow;let h='';
  if(f.step==='first'){
    h='<div class="step">Start the archive</div><p class="q">Who is the earliest ancestor you know of?</p><div class="stack">'+

      '<div class="lab">Family name or father’s name (optional)</div><input class="field" id="ffamily" autocomplete="off" value="'+esc(f.family)+'">'+
      seg('sex',[['m','Male'],['f','Female']],f.sex)+
      '</div><p class="help">Everyone else is added from this person outward: children, spouse, and parents if you later learn of an earlier generation.</p>'+
      '<div class="acts"><button class="btn pri" data-act="first-save">Add to the archive</button></div>';
  }else if(f.step==='name'){
    const sp=f.rel==='child'?spouses(f.of):[];
    h='<div class="step">Add '+RELWORD[f.rel]+'</div><p class="q">'+QUESTION[f.rel](f.of)+'</p><div class="stack">'+
      '<div class="lab">Given name</div><input class="field" id="fgiven" autocomplete="off" value="'+esc(f.given)+'">'+
      '<div class="lab">Family name or father’s name (optional)</div><input class="field" id="ffamily" autocomplete="off" value="'+esc(f.family)+'">'+
      (f.rel==='child'||f.rel==='sibling'?seg('sex',f.rel==='child'?[['m','Son'],['f','Daughter']]:[['m','Brother'],['f','Sister']],f.sex):'')+
      (f.rel==='spouse'&&P[f.of].s==='u'?seg('sex',[['m','Husband'],['f','Wife']],f.sex):'')+
      (sp.length>1?'<div class="lab">Other parent</div><div class="chips">'+sp.map(s=>'<button class="chip'+(f.otherParent===s?' on':'')+'" data-op="'+s+'">'+esc(P[s].name)+'</button>').join('')+'</div>':'')+
      '</div><div class="acts"><button class="btn pri" data-act="name-next">Continue</button><button class="btn txt" data-act="cancel">Cancel</button></div>';
  }else if(f.step==='dup'){
    const m=f.match;
    h='<div class="step">Possible match</div><p class="q">Is this the same person?</p>'+
      '<div class="match"><b>'+esc(m.full_name)+'</b><dl>'+
      '<dt>Child of</dt><dd>'+(m.parents.length?esc(m.parents.join(' and ')):'Not recorded')+'</dd>'+
      '<dt>Born</dt><dd>'+(m.birth_year||'Not recorded')+(m.death_year?' · died '+m.death_year:m.is_living===false?' · passed away':'')+'</dd>'+
      '<dt>Married to</dt><dd>'+(m.spouses.length?esc(m.spouses.join(', ')):'Not recorded')+'</dd>'+
      '<dt>Children</dt><dd>'+(m.children.length?esc(m.children.join(', ')):'None recorded')+'</dd></dl></div>'+
      '<p class="help">You entered “'+esc((f.given+' '+f.family).trim())+'”. If it is the same person, they will be connected as '+who(f.of)+' '+RELWORD[f.rel]+' and no second record is created.</p>'+
      '<div class="acts"><button class="btn pri" data-act="dup-same">Same person</button><button class="btn" data-act="dup-diff">Different person</button><button class="btn txt" data-act="dup-unsure">Not sure</button></div>';
  }else if(f.step==='born'){
    h='<div class="step">'+esc(P[f.newId].name)+'</div><p class="q">When was '+esc(first(f.newId))+' born?</p><div class="stack">'+
      '<input class="field" id="fyear" inputmode="numeric" placeholder="A year is enough, for example 1965" autocomplete="off">'+
      '<label class="check"><input type="checkbox" id="fest"> This is an estimate</label></div>'+
      '<div class="acts"><button class="btn pri" data-act="born-save">Save</button><button class="btn" data-act="born-skip">I don’t know</button></div>';
  }else if(f.step==='living'){
    h='<div class="step">'+esc(P[f.newId].name)+'</div><p class="q">Is '+esc(first(f.newId))+' living?</p>'+
      '<div class="acts"><button class="btn pri" data-act="live-yes">Yes</button><button class="btn" data-act="live-no">No, passed away</button><button class="btn txt" data-act="live-skip">I don’t know</button></div>';
  }else if(f.step==='died'){
    h='<div class="step">'+esc(P[f.newId].name)+'</div><p class="q">In which year did '+esc(first(f.newId))+' pass away?</p>'+
      '<input class="field" id="fyear" inputmode="numeric" placeholder="Year" autocomplete="off">'+
      '<div class="acts"><button class="btn pri" data-act="died-save">Save</button><button class="btn" data-act="died-skip">I don’t know</button></div>';
  }else if(f.step==='done'){
    const n=f.newId,nn=esc(first(n)),opts=[];
    if(f.rel==='father'||f.rel==='mother'){
      opts.push(['father',n,'Add '+nn+'’s father']);
      if(f.rel==='father'&&!mother(f.of))opts.push(['mother',f.of,'Add '+who(f.of)+' mother']);
      if(f.rel==='mother'&&!father(f.of))opts.push(['father',f.of,'Add '+who(f.of)+' father']);
      opts.push(['sibling',f.of,'Add '+who(f.of)+' brother or sister']);
    }else if(f.rel==='first'){opts.push(['child',n,'Add '+nn+'’s child'],['spouse',n,'Add '+nn+'’s spouse'],['father',n,'Add '+nn+'’s father'])}
    else if(f.rel==='child'){opts.push(['child',f.of,'Add another child'],['spouse',n,'Add '+nn+'’s spouse'])}
    else if(f.rel==='spouse'){opts.push(['child',f.of,'Add '+who(f.of)+' child'],['father',n,'Add '+nn+'’s father'])}
    else{opts.push(['sibling',f.of,'Add another brother or sister'],['spouse',n,'Add '+nn+'’s spouse'])}
    h='<div class="step">Saved</div><p class="q">'+esc(P[n].name)+' is now in the family archive.</p>'+
      '<p class="help">'+(P[n].status==='pending'?'Moderators will check whether this is a new person or someone already recorded.':'The record stays marked unverified until a moderator confirms it.')+' What next?</p>'+
      '<div class="acts">'+opts.map((o,i)=>'<button class="btn'+(i?'':' pri')+'" data-next="'+o[0]+'" data-of="'+o[1]+'">'+o[2]+'</button>').join('')+'<button class="btn txt" data-act="done">Done</button></div>';
  }else if(f.step==='edit'){
    const p=P[f.of];
    h='<div class="step">Edit details</div><p class="q">'+esc(p.name)+'</p><div class="stack">'+
      '<div class="lab">Given name</div><input class="field" id="egiven" autocomplete="off" value="'+esc(p.given)+'">'+
      '<div class="lab">Family name or father’s name</div><input class="field" id="efamily" autocomplete="off" value="'+esc(p.family)+'">'+
      '<div class="lab">Known as</div><input class="field" id="eknown" autocomplete="off" value="'+esc(p.known)+'">'+
      '<div class="lab">Gender</div>'+seg('esex',[['m','Male'],['f','Female'],['u','Not recorded']],f.esex)+
      '<div class="lab">Birth year</div><input class="field" id="eborn" inputmode="numeric" autocomplete="off" value="'+(p.b||'')+'">'+
      '<label class="check"><input type="checkbox" id="eest"'+((p.bp==='about'||p.bp==='decade')?' checked':'')+'> Birth year is an estimate</label>'+
      '<div class="lab">Living</div>'+seg('eliv',[['y','Living'],['n','Passed away'],['u','Not known']],f.eliv)+
      (f.eliv==='n'?'<div class="lab">Year of passing</div><input class="field" id="edied" inputmode="numeric" autocomplete="off" value="'+(p.d||'')+'">':'')+
      '</div><div class="acts"><button class="btn pri" data-act="edit-save">Save changes</button><button class="btn txt" data-act="cancel">Cancel</button></div>';
  }
  body.innerHTML=h;body.scrollTop=0;
  const inp=body.querySelector('.field');if(inp&&desktop()&&f.step!=='edit')inp.focus();
}
function keepInputs(){
  const f=flow;if(!f)return;
  if(f.step==='name'||f.step==='first'){f.given=$('fgiven').value;f.family=$('ffamily').value}
  if(f.step==='edit'){f.keep={given:$('egiven').value,family:$('efamily').value,known:$('eknown').value,born:$('eborn').value,est:$('eest').checked,died:$('edied')?$('edied').value:null}}
}
function restoreEdit(){const k=flow.keep;if(!k)return;$('egiven').value=k.given;$('efamily').value=k.family;$('eknown').value=k.known;$('eborn').value=k.born;$('eest').checked=k.est;if($('edied')&&k.died!=null)$('edied').value=k.died}
function parseYear(v,label){
  const t=String(v||'').trim();if(!t)return null;
  const y=parseInt(t,10),now=new Date().getFullYear();
  if(!/^\d{3,4}$/.test(t)||y<1000||y>now)throw new Error((label||'The year')+' should be a year between 1000 and '+now+'.');
  return y;
}
async function createPerson(pending){
  const f=flow;
  const id=await busy(()=>rpc('add_relative',{p_anchor:f.of,p_relation:f.rel,p_given:f.given.trim(),p_family:f.family.trim()||null,p_sex:SEXF[f.sex],p_pending:!!pending,p_other_parent:f.otherParent}));
  if(!id)return;
  await busy(refresh);
  f.newId=id;f.step='born';sel=id;
  const h=host(id);
  if(!h){rootAnchor=id;buildTree()}
  const hh=host(id);reveal(hh);if(TP[hh])expanded.add(TP[hh]);expanded.add(hh);if(f.rel==='child')expanded.add(host(f.of));
  layout();renderSheet();run(viewFor(hh));
}
function afterBorn(){
  const f=flow,p=P[f.newId],now=new Date().getFullYear();
  f.step=(f.rel==='father'||f.rel==='mother'||f.rel==='first'||!p.b||now-p.b>60)?'living':'done';
  layout();run();renderFlow();
}
body.addEventListener('click',async e=>{
  const go=e.target.closest('[data-go]');if(go){focus(go.dataset.go,{expand:true});return}
  const ad=e.target.closest('[data-add]');if(ad){startFlow(ad.dataset.add,sel);return}
  const nx=e.target.closest('[data-next]');if(nx){startFlow(nx.dataset.next,nx.dataset.of);return}
  const f=flow;
  const sx=e.target.closest('[data-sex]');if(sx){keepInputs();f.sex=sx.dataset.sex;renderFlow();return}
  const op=e.target.closest('[data-op]');if(op){keepInputs();f.otherParent=op.dataset.op;renderFlow();return}
  const es=e.target.closest('[data-esex]');if(es){keepInputs();f.esex=es.dataset.esex;renderFlow();restoreEdit();return}
  const el=e.target.closest('[data-eliv]');if(el){keepInputs();f.eliv=el.dataset.eliv;renderFlow();restoreEdit();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='edit'){const p=P[sel];flow={step:'edit',of:sel,esex:p.s,eliv:p.living===true?'y':(p.living===false||p.d)?'n':'u'};renderSheet()}
  else if(a==='verify'){const id=sel;if(await busy(()=>rpc('update_person',{p_id:id,p_changes:{status:'verified'}}).then(()=>true))){await busy(refresh);layout();run();renderSheet();toast(first(id)+' is now verified')}}
  else if(a==='line'){(function open(id){expanded.add(id);tkids(id).forEach(open)})(sel);layout();run(viewFor(sel,Math.min(view.k,0.6)));toast('Opened every generation below '+first(sel))}
  else if(a==='cancel'){flow=null;renderSheet()}
  else if(a==='first-save'){
    keepInputs();
    if(f.given.trim().length<2){$('fgiven').focus();toast('Enter a given name to continue',true);return}
    const id=await busy(()=>rpc('add_person',{p_given:f.given.trim(),p_family:f.family.trim()||null,p_sex:SEXF[f.sex]}));
    if(!id)return;
    await busy(refresh);
    flow={rel:'first',of:id,newId:id,step:'born'};sel=id;expanded.add(id);
    layout();renderSheet();run(viewFor(id,0.95));
  }
  else if(a==='name-next'){
    keepInputs();
    if(f.given.trim().length<2){$('fgiven').focus();toast('Enter a given name to continue',true);return}
    const full=(f.given+' '+f.family).trim();
    const ms=await busy(()=>rpc('find_matches',{p_name:full,p_sex:SEXF[f.sex],p_exclude:[f.of]}));
    if(ms===undefined)return;
    if(ms.length){f.match=ms[0];f.step='dup';renderFlow()}else await createPerson(false);
  }
  else if(a==='dup-same'){
    const m=f.match;
    const ok=await busy(()=>rpc('link_existing',{p_anchor:f.of,p_relation:f.rel,p_existing:m.id,p_other_parent:f.otherParent}));
    if(!ok)return;
    await busy(refresh);flow=null;focus(m.id,{expand:true});
    toast('No new record created. '+m.full_name+' is now connected.');
  }
  else if(a==='dup-diff')await createPerson(false);
  else if(a==='dup-unsure'){await createPerson(true);if(flow&&flow.newId)toast('Saved, and flagged for the moderators to check')}
  else if(a==='born-save'||a==='born-skip'){
    let ok;
    if(a==='born-save'){
      let y;try{y=parseYear($('fyear').value,'The birth year')}catch(err){toast(err.message,true);return}
      if(!y){toast('Enter a year, or choose I don’t know',true);return}
      ok=await busy(()=>rpc('update_person',{p_id:f.newId,p_changes:{birth_year:y,birth_precision:$('fest').checked?'about':'year'}}).then(()=>true));
    }else ok=await busy(()=>rpc('mark_unknown',{p_person:f.newId,p_fact:'birth_date'}).then(()=>true));
    if(!ok)return;
    await busy(refresh);afterBorn();
  }
  else if(a==='live-yes'){if(await busy(()=>rpc('update_person',{p_id:f.newId,p_changes:{is_living:true}}).then(()=>true))){await busy(refresh);f.step='done';layout();run();renderFlow()}}
  else if(a==='live-no'){if(await busy(()=>rpc('update_person',{p_id:f.newId,p_changes:{is_living:false}}).then(()=>true))){await busy(refresh);f.step='died';layout();run();renderFlow()}}
  else if(a==='live-skip'){f.step='done';renderFlow()}
  else if(a==='died-save'||a==='died-skip'){
    let ok=true;
    if(a==='died-save'){
      let y;try{y=parseYear($('fyear').value,'The year')}catch(err){toast(err.message,true);return}
      if(!y){toast('Enter a year, or choose I don’t know',true);return}
      ok=await busy(()=>rpc('update_person',{p_id:f.newId,p_changes:{death_year:y}}).then(()=>true));
    }else ok=await busy(()=>rpc('mark_unknown',{p_person:f.newId,p_fact:'death_date'}).then(()=>true));
    if(!ok)return;
    await busy(refresh);f.step='done';layout();run();renderFlow();
  }
  else if(a==='edit-save'){
    const p=P[f.of],ch={};let born,died=null;
    try{born=parseYear($('eborn').value,'The birth year');if($('edied'))died=parseYear($('edied').value,'The year of passing')}catch(err){toast(err.message,true);return}
    const gv=$('egiven').value.trim(),fm=$('efamily').value.trim(),kn=$('eknown').value.trim(),est=$('eest').checked;
    if(gv.length<2){toast('A given name is needed',true);return}
    if(gv!==p.given)ch.given_name=gv;
    if(fm!==p.family)ch.family_name=fm;
    if(kn!==p.known)ch.known_as=kn;
    if(f.esex!==p.s)ch.sex=SEXF[f.esex];
    const wasEst=p.bp==='about'||p.bp==='decade';
    if(born!==(p.b||null)){ch.birth_year=born;if(born)ch.birth_precision=est?'about':'year'}
    else if(born&&est!==wasEst)ch.birth_precision=est?'about':'year';
    const liv=f.eliv==='y'?true:f.eliv==='n'?false:null;
    if(f.eliv==='n'){if(died!==(p.d||null))ch.death_year=died;if(p.living!==false)ch.is_living=false}
    else{if(p.d)ch.death_year=null;if(liv!==(p.living===undefined?null:p.living))ch.is_living=liv}
    if(!Object.keys(ch).length){flow=null;renderSheet();return}
    const id=f.of;
    if(!await busy(()=>rpc('update_person',{p_id:id,p_changes:ch}).then(()=>true)))return;
    await busy(refresh);flow=null;layout();run();renderSheet();toast('Saved');
  }
  else if(a==='done'){const id=f.newId;flow=null;focus(id,{})}
});
body.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('field')){e.preventDefault();const b=body.querySelector('.btn.pri');if(b)b.click()}});
$('close').addEventListener('click',()=>{flow=null;sel=null;renderSheet();syncEls()});

/* ---------- Search and controls ---------- */
const q=$('q'),results=$('results');
q.addEventListener('input',()=>{
  const s=q.value.trim().toLowerCase();
  if(!s){results.classList.remove('on');return}
  const k=nameKey(s);
  const rank=p=>{const n=p.name.toLowerCase();return n.startsWith(s)?0:(n+' '+p.known.toLowerCase()).includes(s)?1:(k.length>1&&n.split(' ').some(w=>nameKey(w)===k))?2:9};
  const hits=Object.values(P).map(p=>[rank(p),p]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name)).slice(0,8).map(x=>x[1]);
  results.innerHTML=hits.length?hits.map(p=>'<button data-go="'+p.id+'">'+esc(p.name)+'<small>'+esc(years(p))+'</small></button>').join(''):'<p>No one by that name yet.</p>';
  results.classList.add('on');
});
results.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;results.classList.remove('on');q.value='';q.blur();focus(b.dataset.go,{expand:true})});
const mid=()=>{const f=frame();return [f.w/2,f.h/2]};
function zoomBtn(fac){const [x,y]=mid();const v={...view};zoomAt(x,y,fac);const to={...view};view=v;run(to,200)}
$('zin').addEventListener('click',()=>zoomBtn(1.35));
$('zout').addEventListener('click',()=>zoomBtn(1/1.35));
$('findme').addEventListener('click',()=>{if(rootAnchor){rootAnchor=null;buildTree();cur={}}const h=ME||ROOT;if(h)focus(h,{k:1})});
$('fit').addEventListener('click',fitAll);

/* ---------- Sign-in and start ---------- */
const gate=$('gate'),gatemsg=$('gatemsg');
function showGate(mode,msg,isErr){
  gate.hidden=false;$('login').hidden=mode!=='login';$('notmember').hidden=mode!=='notmember';$('reset').hidden=mode!=='reset';
  gatemsg.textContent=msg||'';gatemsg.className='msg'+(isErr?'':' info');
}
async function enter(){
  showGate('wait','Opening the family archive…');
  let me;
  try{me=await rpc('me')}catch(e){showGate('login',String(e.message||e),true);return}
  if(!me){showGate('notmember');return}
  ME=me.person_id||null;ROLE=me.role;
  try{await refresh()}catch(e){showGate('login',String(e.message||e),true);return}
  expanded.clear();
  const home=ME||ROOT;
  if(home){let c=home;expanded.add(c);while(TP[c]){c=TP[c];expanded.add(c)}}
  layout();sel=desktop()?home:null;renderSheet();
  cur={};for(const id in tgt)cur[id]={x:tgt[id].x,y:tgt[id].y};
  gate.hidden=true;
  syncEls();if(home)view=viewFor(home,desktop()?0.95:0.85);draw();
  if(ME&&Object.keys(P).length===1){sel=ME;renderSheet();run(viewFor(ME));toast('Welcome. Start by adding your father and mother.')}
}
async function signOut(){if(sb)await sb.auth.signOut();for(const id in els){els[id].remove();delete els[id]}P={};tgt={};cur={};epath.setAttribute('d','');sel=null;flow=null;sheet.classList.remove('on');showGate('login','')}
$('out').addEventListener('click',signOut);$('out2').addEventListener('click',signOut);
function authMsg(error){
  const m=(error&&error.message)||'';
  if(/invalid login credentials/i.test(m))return 'That email and password do not match. Check both, or use Forgot password? to set a new one.';
  if(/not confirmed/i.test(m))return 'This email address has not been confirmed yet. Ask the family admin to confirm it.';
  if(/rate limit|security purposes|too many/i.test(m))return 'Too many attempts just now. Please wait a few minutes and try again.';
  if(/fetch|network|load failed/i.test(m))return 'Could not reach the sign-in service. Check your internet connection. If this page is open inside a preview window, open the file in Chrome or Edge instead.';
  return m||'Something went wrong. Please try again.';
}
// Buttons act on click, not on form submission, so they work even where a window blocks forms.
let signing=false;
async function doLogin(){
  if(signing)return;
  const em=$('email').value.trim(),pw=$('pass').value;
  if(!/^\S+@\S+\.\S+$/.test(em)){showGate('login','Enter your email address.',true);return}
  if(!pw){showGate('login','Enter your password.',true);return}
  signing=true;
  try{await doLoginInner(em,pw)}finally{signing=false}
}
async function doLoginInner(em,pw){
  const btn=$('loginbtn');btn.disabled=true;showGate('login','Signing in…');
  let r;try{r=await sb.auth.signInWithPassword({email:em,password:pw})}catch(err){r={error:err}}
  btn.disabled=false;
  if(r.error){showGate('login',authMsg(r.error),true);return}
  $('pass').value='';
  enter();
}
$('loginbtn').addEventListener('click',doLogin);
$('login').addEventListener('submit',e=>e.preventDefault());
$('login').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();doLogin()}});
/* Forgot password: a code is emailed, then a new password is set here. No web address needed. */
let rstep=1;
function showReset(step,msg,isErr){
  rstep=step;showGate('reset',msg,isErr);
  $('rs1').hidden=step!==1;$('rs2').hidden=step!==2;
  $('resethelp').textContent=step===1?'Enter your email and we will send you a code to set a new password.':'Enter the code sent to '+$('remail').value.trim()+' and choose a new password.';
}
async function sendCode(){
  const em=$('remail').value.trim();
  if(!/^\S+@\S+\.\S+$/.test(em)){showReset(1,'Enter your email address.',true);return}
  $('rsend').disabled=true;showReset(1,'Sending…');
  let r;try{r=await sb.auth.resetPasswordForEmail(em)}catch(err){r={error:err}}
  $('rsend').disabled=false;
  if(r.error){showReset(1,authMsg(r.error),true);return}
  $('rcode').value='';$('rpass').value='';$('rpass2').value='';
  showReset(2,'If that email belongs to a member, a code is on its way. Check the junk folder too.');
}
async function setNewPassword(){
  const em=$('remail').value.trim(),code=$('rcode').value.replace(/\D/g,''),p1=$('rpass').value,p2=$('rpass2').value;
  if(code.length<6){showReset(2,'Enter the code from the email.',true);return}
  if(p1.length<8){showReset(2,'Choose a password of at least 8 characters.',true);return}
  if(p1!==p2){showReset(2,'The two passwords are not the same.',true);return}
  $('rsave').disabled=true;showReset(2,'Checking the code…');
  let r;try{r=await sb.auth.verifyOtp({email:em,token:code,type:'recovery'})}catch(err){r={error:err}}
  if(r.error){$('rsave').disabled=false;showReset(2,/fetch|network/i.test(r.error.message||'')?authMsg(r.error):'That code is not right or has expired. Use Send a new code and try again.',true);return}
  try{r=await sb.auth.updateUser({password:p1})}catch(err){r={error:err}}
  $('rsave').disabled=false;
  if(r.error){showReset(2,authMsg(r.error),true);return}
  $('rpass').value='';$('rpass2').value='';$('rcode').value='';
  enter();
}
$('forgot').addEventListener('click',()=>{$('remail').value=$('email').value;showReset(1,'')});
$('rback').addEventListener('click',()=>showGate('login',''));
$('rresend').addEventListener('click',sendCode);
$('rsend').addEventListener('click',sendCode);
$('rsave').addEventListener('click',setNewPassword);
$('reset').addEventListener('submit',e=>e.preventDefault());
$('reset').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();rstep===1?sendCode():setNewPassword()}});
(async function start(){
  if(TEST){enter();return}
  if(!window.supabase){showGate('wait','Could not reach the sign-in service. Check your internet connection and reload.',true);return}
  sb=window.supabase.createClient(CFG.url,CFG.key);
  const {data}=await sb.auth.getSession();
  if(data&&data.session)enter();else showGate('login','');
})();
</script>
